<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecondSelf - Login</title>
  <link rel="stylesheet" href="loginpage.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #170E17;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #particle-drift-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
      pointer-events: auto;
    }
    .login-container-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      --login-box-color: rgba(30, 22, 32, 0.82);
    }
    .login-box {
      background: var(--login-box-color);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
  </style>
</head>
<body>
  <!-- Live WebGL Particle Drift Canvas -->
  <canvas id="particle-drift-canvas"></canvas>

  <!-- Centered Login Box -->
  <div class="login-container-wrap">
    <div class="container">
      <div class="login-box">
        <form class="form" id="auth-form" onsubmit="handleAuthSubmit(event);">
          <div class="logo"></div>
          <span class="header" id="form-header">Welcome Back!</span>
          <div id="auth-msg" style="display:none;font-size:12px;padding:8px 12px;border-radius:10px;text-align:center;width:100%;margin-bottom:8px;line-height:1.4;"></div>

          <div id="signup-fields" style="display:none;width:100%;margin-bottom:6px;">
            <input type="text" id="reg-name" placeholder="Full Name" class="input" />
          </div>

          <input type="email" id="auth-email" placeholder="Email" class="input" required />
          <input type="password" id="auth-password" placeholder="Password" class="input" required />

          <div id="signup-confirm-field" style="display:none;width:100%;margin-top:6px;">
            <input type="password" id="reg-confirm" placeholder="Confirm Password" class="input" />
          </div>

          <button type="submit" id="submit-btn" class="button sign-in">Sign In</button>
          
          <button type="button" id="google-btn" class="button google-sign-in" onclick="handleGoogleSignIn();">
            <svg
              class="icon"
              viewBox="-3 0 262 262"
              xmlns="http://www.w3.org/2000/svg"
              preserveAspectRatio="xMidYMid"
              fill="#000000"
            >
              <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
              <g
                id="SVGRepo_tracerCarrier"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></g>
              <g id="SVGRepo_iconCarrier">
                <path
                  d="M255.878 133.451c0-10.734-.871-18.567-2.756-26.69H130.55v48.448h71.947c-1.45 12.04-9.283 30.172-26.69 42.356l-.244 1.622 38.755 30.023 2.685.268c24.659-22.774 38.875-56.282 38.875-96.027"
                  fill="#4285F4"
                ></path>
                <path
                  d="M130.55 261.1c35.248 0 64.839-11.605 86.453-31.622l-41.196-31.913c-11.024 7.688-25.82 13.055-45.257 13.055-34.523 0-63.824-22.773-74.269-54.25l-1.531.13-40.298 31.187-.527 1.465C35.393 231.798 79.49 261.1 130.55 261.1"
                  fill="#34A853"
                ></path>
                <path
                  d="M56.281 156.37c-2.756-8.123-4.351-16.827-4.351-25.82 0-8.994 1.595-17.697 4.206-25.82l-.073-1.73L15.26 71.312l-1.335.635C5.077 89.644 0 109.517 0 130.55s5.077 40.905 13.925 58.602l42.356-32.782"
                  fill="#FBBC05"
                ></path>
                <path
                  d="M130.55 50.479c24.514 0 41.05 10.589 50.479 19.438l36.844-35.974C195.245 12.91 165.798 0 130.55 0 79.49 0 35.393 29.301 13.925 71.947l42.211 32.783c10.59-31.477 39.891-54.251 74.414-54.251"
                  fill="#EB4335"
                ></path>
              </g>
            </svg>
            <span class="span two" id="google-btn-text"> Sign in with Google </span>
          </button>

          <p class="footer" id="footer-container">
            <span id="prompt-text">Don't have an account?</span>
            <a href="javascript:void(0)" id="auth-toggle-link" onclick="toggleAuthMode();" class="link">Create one</a>
            <br />
            <a href="javascript:void(0)" id="forgot-link" onclick="handleForgotPassword();" class="link">Forgot password?</a>
          </p>
        </form>
      </div>
    </div>
  </div>


  <!-- WebGL Particle Drift Implementation from firstpage.12 -->
  <script>
  (function initParticleDrift() {
    const canvas = document.getElementById("particle-drift-canvas");
    if (!canvas) return;

    const gl = canvas.getContext("webgl", {
      alpha: true,
      antialias: false,
      depth: false,
      premultipliedAlpha: true
    });
    if (!gl) {
      console.warn("ParticleDrift: WebGL not available");
      return;
    }

    const MAX_DPR = 2;
    const MAX_LINES = 8000;
    const EDGE = 20;

    const config = {
      background: "#170E17",
      baseColor: "#BC7BB9",
      accentColor: "#AC6BAD",
      density: 220,
      dotSize: 5,
      speed: 1.0,
      direction: 56,
      hover: 1.6,
      linkDistance: 175,
      linkThickness: 1.0
    };

    const LINE_VERT = `
      precision highp float;
      attribute vec2 a_p0;
      attribute vec2 a_p1;
      attribute vec2 a_corner;
      attribute vec3 a_shade;
      uniform vec2 uSize;
      varying float v_alpha;
      varying float v_mix;
      varying float v_off;
      varying float v_half;
      void main(){
        vec2 d = a_p1 - a_p0;
        float len = max(length(d), 1e-5);
        vec2 nrm = vec2(-d.y, d.x) / len;
        float half_ = max(a_shade.z * 0.5, 0.35);
        float ext = half_ + 0.75;
        vec2 p = mix(a_p0, a_p1, a_corner.x);
        p += nrm * a_corner.y * ext;
        v_alpha = a_shade.x;
        v_mix = a_shade.y;
        v_off = a_corner.y * ext;
        v_half = half_;
        gl_Position = vec4(p.x / uSize.x * 2.0 - 1.0, 1.0 - p.y / uSize.y * 2.0, 0.0, 1.0);
      }
    `;

    const LINE_FRAG = `
      precision mediump float;
      uniform vec3 uBase, uAccent;
      varying float v_alpha;
      varying float v_mix;
      varying float v_off;
      varying float v_half;
      void main(){
        float cov = clamp((v_half - abs(v_off)) / 0.75 + 0.5, 0.0, 1.0);
        float a = v_alpha * cov;
        vec3 col = mix(uBase, uAccent, v_mix);
        gl_FragColor = vec4(col * a, a);
      }
    `;

    const DOT_VERT = `
      precision highp float;
      attribute vec2 a_pos;
      attribute float a_lit;
      uniform vec2 uSize;
      uniform float uDpr, uDot;
      varying float v_lit;
      void main(){
        gl_PointSize = max(1.0, uDot * uDpr);
        v_lit = a_lit;
        gl_Position = vec4(a_pos.x / uSize.x * 2.0 - 1.0, 1.0 - a_pos.y / uSize.y * 2.0, 0.0, 1.0);
      }
    `;

    const DOT_FRAG = `
      precision mediump float;
      uniform vec3 uBase, uAccent;
      uniform float uRestAlpha;
      varying float v_lit;
      void main(){
        float d = length(gl_PointCoord - 0.5) * 2.0;
        float disc = 1.0 - smoothstep(0.72, 1.0, d);
        vec3 col = mix(uBase, uAccent, v_lit);
        float a = disc * mix(uRestAlpha, 1.0, v_lit);
        if (a <= 0.004) discard;
        gl_FragColor = vec4(col * a, a);
      }
    `;

    function compile(type, src) {
      const sh = gl.createShader(type);
      if (!sh) return null;
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        console.error("Shader error:", gl.getShaderInfoLog(sh));
        gl.deleteShader(sh);
        return null;
      }
      return sh;
    }

    function linkProg(vsSrc, fsSrc) {
      const vs = compile(gl.VERTEX_SHADER, vsSrc);
      const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
      if (!vs || !fs) return null;
      const prog = gl.createProgram();
      if (!prog) return null;
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        console.error("Program link error:", gl.getProgramInfoLog(prog));
        return null;
      }
      return prog;
    }

    function parseColor(input, fb) {
      if (!input) return fb;
      const str = String(input).trim();
      if (str.charAt(0) === "#") {
        let hex = str.slice(1);
        if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
        if (hex.length >= 6) {
          const r = parseInt(hex.slice(0, 2), 16);
          const g = parseInt(hex.slice(2, 4), 16);
          const b = parseInt(hex.slice(4, 6), 16);
          if (!isNaN(r) && !isNaN(g) && !isNaN(b)) return [r / 255, g / 255, b / 255];
        }
      }
      return fb;
    }

    function rng(seed) {
      let a = seed >>> 0;
      return function() {
        a += 0x6d2b79f5;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const CORNERS = [
      [0, -1], [1, -1], [1, 1],
      [0, -1], [1, 1], [0, 1]
    ];

    const lineProg = linkProg(LINE_VERT, LINE_FRAG);
    const dotProg = linkProg(DOT_VERT, DOT_FRAG);
    if (!lineProg || !dotProg) return;

    const locs = new Map();
    const u = (prog, name) => {
      const key = (prog === lineProg ? "L:" : "D:") + name;
      if (!locs.has(key)) locs.set(key, gl.getUniformLocation(prog, name));
      return locs.get(key);
    };

    const lP0 = new Float32Array(MAX_LINES * 6 * 2);
    const lP1 = new Float32Array(MAX_LINES * 6 * 2);
    const lCorner = new Float32Array(MAX_LINES * 6 * 2);
    const lShade = new Float32Array(MAX_LINES * 6 * 3);
    for (let e = 0; e < MAX_LINES; e++) {
      for (let c = 0; c < 6; c++) {
        const k = (e * 6 + c) * 2;
        lCorner[k] = CORNERS[c][0];
        lCorner[k + 1] = CORNERS[c][1];
      }
    }

    const bP0 = gl.createBuffer();
    const bP1 = gl.createBuffer();
    const bCorner = gl.createBuffer();
    const bShade = gl.createBuffer();

    gl.bindBuffer(gl.ARRAY_BUFFER, bP0);
    gl.bufferData(gl.ARRAY_BUFFER, lP0.byteLength, gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, bP1);
    gl.bufferData(gl.ARRAY_BUFFER, lP1.byteLength, gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, bCorner);
    gl.bufferData(gl.ARRAY_BUFFER, lCorner, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, bShade);
    gl.bufferData(gl.ARRAY_BUFFER, lShade.byteLength, gl.DYNAMIC_DRAW);

    const R = rng(20260824);
    let nCount = 0;
    let nx = new Float32Array(0);
    let ny = new Float32Array(0);
    let nSpd = new Float32Array(0);
    let gPos = new Float32Array(0);
    let gLit = new Float32Array(0);
    const bGPos = gl.createBuffer();
    const bGLit = gl.createBuffer();

    function buildNodes(n, w, h) {
      nCount = n;
      nx = new Float32Array(n);
      ny = new Float32Array(n);
      nSpd = new Float32Array(n);
      gPos = new Float32Array(n * 2);
      gLit = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        nx[i] = R() * w;
        ny[i] = R() * h;
        nSpd[i] = (R() * 0.4 + 0.1) * 60;
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, bGPos);
      gl.bufferData(gl.ARRAY_BUFFER, gPos.byteLength, gl.DYNAMIC_DRAW);
      gl.bindBuffer(gl.ARRAY_BUFFER, bGLit);
      gl.bufferData(gl.ARRAY_BUFFER, gLit.byteLength, gl.DYNAMIC_DRAW);
    }

    const ptr = { x: -10000, y: -10000 };
    window.addEventListener("pointermove", (e) => {
      ptr.x = e.clientX;
      ptr.y = e.clientY;
    });
    window.addEventListener("pointerleave", () => {
      ptr.x = -10000;
      ptr.y = -10000;
    });

    let last = performance.now();
    let builtN = -1;
    let builtW = 0;
    let builtH = 0;

    function render(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;

      const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
      const cw = window.innerWidth;
      const ch = window.innerHeight;
      const bw = Math.max(1, Math.round(cw * dpr));
      const bh = Math.max(1, Math.round(ch * dpr));

      if (canvas.width !== bw || canvas.height !== bh) {
        canvas.width = bw;
        canvas.height = bh;
      }
      gl.viewport(0, 0, bw, bh);

      if (config.density !== builtN) {
        buildNodes(config.density, cw, ch);
        builtN = config.density;
      }

      if (cw !== builtW || ch !== builtH) {
        const sx = cw / Math.max(builtW || cw, 1);
        const sy = ch / Math.max(builtH || ch, 1);
        for (let i = 0; i < nCount; i++) {
          nx[i] *= sx;
          ny[i] *= sy;
        }
        builtW = cw;
        builtH = ch;
      }

      const reach = 180 * (config.hover > 0 ? 1 : 0);
      const LINKD = config.linkDistance;
      const LINKW = config.linkThickness;
      const th = (config.direction * Math.PI) / 180;
      const dirX = Math.sin(th);
      const dirY = Math.cos(th);

      let lines = 0;
      function pushLine(x0, y0, x1, y1, a0, a1, mix, wpx) {
        if (lines >= MAX_LINES) return;
        for (let c = 0; c < 6; c++) {
          const k = (lines * 6 + c) * 2;
          const s3 = (lines * 6 + c) * 3;
          lP0[k] = x0;
          lP0[k + 1] = y0;
          lP1[k] = x1;
          lP1[k + 1] = y1;
          lShade[s3] = CORNERS[c][0] === 0 ? a0 : a1;
          lShade[s3 + 1] = mix;
          lShade[s3 + 2] = wpx;
        }
        lines++;
      }

      for (let i = 0; i < nCount; i++) {
        nx[i] += nSpd[i] * dirX * dt * config.speed;
        ny[i] += nSpd[i] * dirY * dt * config.speed;

        if (nx[i] < -EDGE) {
          nx[i] = cw + EDGE;
          ny[i] = R() * ch;
        } else if (nx[i] > cw + EDGE) {
          nx[i] = -EDGE;
          ny[i] = R() * ch;
        }
        if (ny[i] < -EDGE) {
          ny[i] = ch + EDGE;
          nx[i] = R() * cw;
        } else if (ny[i] > ch + EDGE) {
          ny[i] = -EDGE;
          nx[i] = R() * cw;
        }

        const dx = ptr.x - nx[i];
        const dy = ptr.y - ny[i];
        const d = Math.sqrt(dx * dx + dy * dy);
        const lit = reach > 0 && d < reach ? 1 : 0;
        if (lit === 1) {
          const a = 0.5 * (1 - d / reach) * config.hover;
          pushLine(nx[i], ny[i], ptr.x, ptr.y, a, a, 1, LINKW);
        }
        gPos[i * 2] = nx[i];
        gPos[i * 2 + 1] = ny[i];
        gLit[i] = lit;
      }

      if (LINKD > 0) {
        const l2 = LINKD * LINKD;
        for (let i = 0; i < nCount && lines < MAX_LINES; i++) {
          for (let j = i + 1; j < nCount && lines < MAX_LINES; j++) {
            const dx = nx[i] - nx[j];
            const dy = ny[i] - ny[j];
            const dd = dx * dx + dy * dy;
            if (dd >= l2) continue;
            const a = 0.18 * (1 - Math.sqrt(dd) / LINKD);
            pushLine(nx[i], ny[i], nx[j], ny[j], a, a, 0, LINKW);
          }
        }
      }

      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.disable(gl.DEPTH_TEST);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

      const cb = parseColor(config.baseColor, [0.737, 0.482, 0.725]);
      const ca = parseColor(config.accentColor, [0.675, 0.420, 0.678]);

      if (lines > 0) {
        gl.useProgram(lineProg);
        const verts = lines * 6;
        gl.bindBuffer(gl.ARRAY_BUFFER, bP0);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, lP0.subarray(0, verts * 2));
        const aP0 = gl.getAttribLocation(lineProg, "a_p0");
        gl.enableVertexAttribArray(aP0);
        gl.vertexAttribPointer(aP0, 2, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, bP1);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, lP1.subarray(0, verts * 2));
        const aP1 = gl.getAttribLocation(lineProg, "a_p1");
        gl.enableVertexAttribArray(aP1);
        gl.vertexAttribPointer(aP1, 2, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, bCorner);
        const aCorner = gl.getAttribLocation(lineProg, "a_corner");
        gl.enableVertexAttribArray(aCorner);
        gl.vertexAttribPointer(aCorner, 2, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, bShade);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, lShade.subarray(0, verts * 3));
        const aShade = gl.getAttribLocation(lineProg, "a_shade");
        gl.enableVertexAttribArray(aShade);
        gl.vertexAttribPointer(aShade, 3, gl.FLOAT, false, 0, 0);

        gl.uniform2f(u(lineProg, "uSize"), cw, ch);
        gl.uniform3f(u(lineProg, "uBase"), cb[0], cb[1], cb[2]);
        gl.uniform3f(u(lineProg, "uAccent"), ca[0], ca[1], ca[2]);
        gl.drawArrays(gl.TRIANGLES, 0, verts);

        gl.disableVertexAttribArray(aP0);
        gl.disableVertexAttribArray(aP1);
        gl.disableVertexAttribArray(aCorner);
        gl.disableVertexAttribArray(aShade);
      }

      if (nCount > 0) {
        gl.useProgram(dotProg);
        gl.bindBuffer(gl.ARRAY_BUFFER, bGPos);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, gPos);
        const aPos = gl.getAttribLocation(dotProg, "a_pos");
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, bGLit);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, gLit);
        const aLit = gl.getAttribLocation(dotProg, "a_lit");
        gl.enableVertexAttribArray(aLit);
        gl.vertexAttribPointer(aLit, 1, gl.FLOAT, false, 0, 0);

        gl.uniform2f(u(dotProg, "uSize"), cw, ch);
        gl.uniform1f(u(dotProg, "uDpr"), dpr);
        gl.uniform1f(u(dotProg, "uDot"), config.dotSize);
        gl.uniform1f(u(dotProg, "uRestAlpha"), 0.45);
        gl.uniform3f(u(dotProg, "uBase"), cb[0], cb[1], cb[2]);
        gl.uniform3f(u(dotProg, "uAccent"), ca[0], ca[1], ca[2]);
        gl.drawArrays(gl.POINTS, 0, nCount);

        gl.disableVertexAttribArray(aPos);
        gl.disableVertexAttribArray(aLit);
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  })();

  // Interactive Authentication Controller
  let authMode = "signin";

  function showMessage(msg, isError = true) {
    const el = document.getElementById("auth-msg");
    if (!el) return;
    el.style.display = "block";
    el.style.color = isError ? "#ff8787" : "#69db7c";
    el.style.background = isError ? "rgba(255,107,107,0.18)" : "rgba(81,207,102,0.18)";
    el.style.border = isError ? "1px solid rgba(255,107,107,0.3)" : "1px solid rgba(81,207,102,0.3)";
    el.innerText = msg;
  }

  function clearMessage() {
    const el = document.getElementById("auth-msg");
    if (el) el.style.display = "none";
  }

  function toggleAuthMode() {
    clearMessage();
    authMode = authMode === "signin" ? "signup" : "signin";
    const header = document.getElementById("form-header");
    const signupFields = document.getElementById("signup-fields");
    const confirmField = document.getElementById("signup-confirm-field");
    const submitBtn = document.getElementById("submit-btn");
    const googleBtnText = document.getElementById("google-btn-text");
    const promptText = document.getElementById("prompt-text");
    const toggleLink = document.getElementById("auth-toggle-link");

    if (authMode === "signup") {
      header.innerText = "Create Account";
      signupFields.style.display = "block";
      confirmField.style.display = "block";
      submitBtn.innerText = "Create Account";
      googleBtnText.innerText = " Sign up with Google";
      promptText.innerText = "Already have an account?";
      toggleLink.innerText = "Sign in";
    } else {
      header.innerText = "Welcome Back!";
      signupFields.style.display = "none";
      confirmField.style.display = "none";
      submitBtn.innerText = "Sign In";
      googleBtnText.innerText = " Sign in with Google";
      promptText.innerText = "Don't have an account?";
      toggleLink.innerText = "Create one";
    }
  }

  function handleForgotPassword() {
    clearMessage();
    const email = document.getElementById("auth-email").value.trim();
    if (!email) {
      showMessage("Please enter your registered email address first.");
      return;
    }
    showMessage("Password reset instructions have been simulated for " + email, false);
  }

  function handleAuthSubmit(e) {
    e.preventDefault();
    clearMessage();

    const email = (document.getElementById("auth-email").value || "").trim().toLowerCase();
    const password = document.getElementById("auth-password").value;

    if (!email || !password) {
      showMessage("Please fill in both email and password.");
      return;
    }

    let accounts = {};
    try {
      accounts = JSON.parse(localStorage.getItem("secondself_registered_users") || "{}");
    } catch(err) {
      accounts = {};
    }

    if (authMode === "signup") {
      const name = (document.getElementById("reg-name").value || "").trim();
      const confirm = document.getElementById("reg-confirm").value;

      if (password.length < 6) {
        showMessage("Password must be at least 6 characters.");
        return;
      }
      if (password !== confirm) {
        showMessage("Passwords do not match.");
        return;
      }
      if (accounts[email]) {
        showMessage("An account with this email already exists. Please sign in.");
        return;
      }

      const newUser = {
        id: "user_" + Math.random().toString(36).substring(2, 10),
        email: email,
        name: name || email.split("@")[0],
        password: password,
        provider: "email",
        created_at: new Date().toISOString()
      };

      accounts[email] = newUser;
      localStorage.setItem("secondself_registered_users", JSON.stringify(accounts));
      localStorage.setItem("secondself_active_user", JSON.stringify(newUser));

      showMessage("Account created successfully! Welcome " + newUser.name + "!", false);
      setTimeout(() => {
        window.location.href = "app.py";
      }, 1200);

    } else {
      // Strict sign-in validation: random text MUST NOT log in!
      if (!accounts[email]) {
        showMessage("❌ No account found with this email. Please click 'Create one' below to register.");
        return;
      }

      const existingUser = accounts[email];
      if (existingUser.password !== password) {
        showMessage("❌ Incorrect password. Please try again.");
        return;
      }

      localStorage.setItem("secondself_active_user", JSON.stringify(existingUser));
      showMessage("Login successful! Welcome back, " + existingUser.name + "!", false);
      setTimeout(() => {
        window.location.href = "app.py";
      }, 800);
    }
  }

    clearMessage();
    const clientId = atob("NTc5OTYwNzQyMTk5LWR2OGRyMHRxNzdrb3RwcTJubDVscGZqaWU1a2puNDZnLmFwcHMuZ29vZ2xldXNlcmNvbnRlbnQuY29t");
    const redirectUri = encodeURIComponent("https://second-self-monster.streamlit.app/");
    const googleAuthUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=openid+email+profile&access_type=offline&prompt=select_account+consent`;
